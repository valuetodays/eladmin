# for gitee
kind: pipeline
type: docker
name: quarkus-system-quarkus-ci/cd

workspace:
  path: /drone/src

node:
  provider: volcengine
  xcxg: 4c8g

clone:
  depth: 1
  disable: false

steps:
  - name: compile code
    image: eclipse-temurin:25-jdk
    environment:
      KEY_A: value_a
    volumes:
      - name: maven_m2_dir
        path: /root/.m2   # path in the container
      - name: maven_m2_repo_dir
        path: /opt/maven-m2/repository   # path in the container
      - name: workbench_dir
        path: /root/workbench_dir
    commands:
      # 获取environment的KEY_A不成功
      - echo 1=${KEY_A} 2=$${KEY_A}
      # use 内置变量 https://docs.drone.io/pipeline/environment/reference/
      - echo ${DRONE_GIT_HTTP_URL} ${DRONE_COMMIT_BRANCH} ${DRONE_BUILD_LINK}
      # echo 后面的字符串中不能有英文冒号，
      - echo "url=${DRONE_GIT_HTTP_URL}, branch=${DRONE_COMMIT_BRANCH}, buildUrl=${DRONE_BUILD_LINK}"
      - env
      - chmod +x ./mvnw
      - ./mvnw -v
      - ./mvnw clean
      - ./mvnw package install -B -U -Dmaven.test.skip=true -DskipUnitTest=true -Dspotless.skip=true
      - sh /drone/src/docs/scripts-for-drone-ci/ci-publish-api-web.sh
  - name: notify
    image: curlimages/curl:8.14.1
    volumes:
      - name: dockersock
        path: /var/run/
      - name: workbench_dir
        path: /root/workbench_dir
    commands:
      - curl --version
      - |
        echo begin to notify
        MSG_ID=$(cat /proc/sys/kernel/random/uuid)

        curl -X POST "https://new.example.com/api/message/push" \
        -H 'Content-Type: application/json; charset=utf-8' \
        -d "{
          \"msgId\":\"$MSG_ID\",
          \"bizId\":\"aaa\",
          \"sourceAppName\":\"app-demo\",
          \"sourceAppIp\":\"127.0.0.1\",
          \"category\":\"BARK\",
          \"type\":\"DEFAULT\",
          \"retryTimes\":0,
          \"timestamp\":\"$(date +%s)\",
          \"priority\":0,
          \"tags\":[\"prod\"],
          \"env\":\"test\",
          \"region\":\"hangzhou\",
          \"data\":{\"toTarget\":\"liulei\",\"title\":\"cdci\",\"rawMsg\":\"portal was restarted just now.\",\"params\":{}},
          \"metadata\":{}
        }"
  - name: restart application by docker-compose
    image: docker:26.1.4-cli
    volumes:
      - name: dockersock
        path: /var/run/
      - name: workbench_dir
        path: /root/workbench_dir
    commands:
      - docker info
      - docker ps -a
      - docker version --format '{{.Client.Version}} -> {{.Server.Version}}'
      - sh /drone/src/docs/scripts-for-drone-ci/ci-restart-docker.sh

trigger:
  branch:
    - master
    - main
    - dev
    - dev-quarkus
  event:
    - push
    - custom

volumes:
  - name: maven_m2_dir
    host:
      path: /opt/maven-m2 # path in host machine
  - name: maven_m2_repo_dir
    host:
      path: /opt/maven-m2/repository # path in host machine
  - name: workbench_dir
    host:
      path: /root/workbench_dir
  - name: dockersock
    host:
      path: /var/run/

